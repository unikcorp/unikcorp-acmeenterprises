    <!-- Right Sweeping Calligraphy Arch / Arm -->
    <path d="M 106 80 C 130 80 160 100 190 145 C 195 152 185 158 178 152 C 150 120 125 105 106 100 Z" fill="#1b3573"/>
    <path d="M 106 75 C 125 55 150 40 180 45 C 188 47 190 38 182 35 C 145 25 120 45 106 65 Z" fill="#1b3573"/>
